.search {

}

.search__icon {

  top: 50%;

  pointer-events: none;
}

.search input {

  border-radius: 8px;

  transition:
    border-color 0.12s ease,
    box-shadow 0.12s ease;
}

.search input::placeholder {

}

.search input:focus {
  border-color: var(--lt-accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--lt-accent) 18%, transparent);
}

.search kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
}

}

.search__results {

  padding: 4px;

}

.search__item {

  padding: 6px 8px;

  text-align: left;

}

.search__item[aria-selected="true"],
.search__item:hover {

}

.search__label {

}

.search__empty {

}

  height: 32px;

.icon-button:hover {

}

.app.panel-hidden .panel {

/* ---------------------------------------------------------------- Canvas */

.canvas {
  position: relative;
  overflow: hidden;
  min-height: 0;
  background-color: var(--lt-canvas);
  background-image: radial-gradient(var(--lt-dot) 1px, transparent 1px);
  background-size: 22px 22px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.canvas.is-panning {
  cursor: grabbing;
}

#graph {
  display: block;
  width: 100%;
  height: 100%;
}

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  max-width: min(560px, calc(100% - 140px));
  padding: 8px 12px;
  font-size: 11.5px;
  color: var(--lt-text-muted);
  background: var(--lt-panel);
  border: 1px solid var(--lt-border);
  border-radius: 10px;
  box-shadow: var(--lt-shadow);
}

.legend__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.legend__swatch {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--swatch);
}

.legend__line {
  width: 16px;
  border-top: 1.5px dashed var(--lt-text-muted);
}

.zoom-indicator {
  position: absolute;
  right: 16px;
  bottom: 16px;
  padding: 3px 8px;
  font: 11.5px var(--lt-font-mono);
  color: var(--lt-text-muted);
  background: var(--lt-panel);
  border: 1px solid var(--lt-border);
  border-radius: 6px;
}

/* Graph interaction states */

.lt-node,
.lt-edge {
  transition: opacity 0.15s ease;
}

.has-selection .lt-node:not(.is-trail),
.has-selection .lt-edge:not(.is-trail) {
  opacity: 0.14;
}

.lt-edge.is-trail .lt-edge__path,
.lt-edge.is-selected .lt-edge__path {
  stroke: var(--lt-accent);
  stroke-opacity: 1;
  stroke-width: 1.8;
  marker-end: url(#lt-arrow-accent);
}

.lt-edge.is-hover .lt-edge__path {
  stroke: var(--lt-edge-strong);
  stroke-opacity: 1;
}

.lt-edge {
  cursor: pointer;
}

.lt-edge__hit {
  fill: none;
  stroke: transparent;
  stroke-width: 12;
}

.lt-node.is-selected .lt-node__box,
.lt-node:focus-visible .lt-node__box {
  stroke: var(--lt-accent);
  stroke-width: 2;
  stroke-dasharray: none;
  stroke-opacity: 1;
}

.lt-node:focus {
  outline: none;
}

.has-search .lt-node:not(.is-match),
.has-search .lt-edge {
  opacity: 0.2;
}

.has-search .lt-node.is-match .lt-node__box {
  stroke: var(--lt-accent);
  stroke-width: 1.5;
}
