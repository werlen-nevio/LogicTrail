name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  VERSION_FILES: package.json package-lock.json claude-plugin/.claude-plugin/plugin.json

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      # Git pushes (the plugin tag and the version commit on main) use the LogicTrail Release
      # GitHub App, which the main branch ruleset lets bypass its rules. Set up once: a GitHub App
      # with Contents read and write, installed on this repository, its Client ID in the
      # RELEASE_APP_ID variable and its private key in the RELEASE_APP_PRIVATE_KEY secret.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci

      # The tag is the source of truth for the version: write it into package.json, the lockfile
      # and the Claude plugin, and commit that on top of the tagged commit. The commit is not on
      # any branch; the plugin tag points at it.
      - name: Set the version from the tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          node scripts/set-version.mjs "$GITHUB_REF_NAME"
          user_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"
          git diff --quiet || git commit -m "Release $GITHUB_REF_NAME" -- $VERSION_FILES
      - name: Check the tag, versions and changelog
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - run: npm run build
      - name: Install the packed CLI and run it
        run: npm run test:package

      # npm trusted publishing: npm exchanges the workflow's OIDC token for a short-lived publish
      # token, so there is no NPM_TOKEN secret. Set up once with:
      #   npm trust github logictrail --file release.yml --repo werlen-nevio/LogicTrail
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "logictrail@$version" version 2>/dev/null)" = "$version" ]; then
            echo "logictrail@$version is already on npm."
            exit 0
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --tag "$dist_tag"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The $GITHUB_REF_NAME release already exists."
            exit 0
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

      - name: Tag the Claude plugin release
        run: |
          plugin_tag="logictrail--$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$plugin_tag" >/dev/null; then
            echo "$plugin_tag already exists."
            exit 0
          fi
          npm install --global @anthropic-ai/claude-code
          claude plugin tag claude-plugin --push

      # Claude Code offers plugin users an update only when plugin.json's version changes on the
      # default branch, so carry a newer stable version back to main. Prereleases and tags older
      # than main's version leave main alone. The push runs CI and, as package.json changes,
      # rebuilds the site.
      - name: Carry the version back to main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD
          node scripts/set-version.mjs "$GITHUB_REF_NAME" --if-newer
          if git diff --quiet; then
            exit 0
          fi
          git commit -m "Set the version to ${GITHUB_REF_NAME#v}" -- $VERSION_FILES
          git push origin HEAD:main
