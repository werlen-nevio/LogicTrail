name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release and the plugin tag
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Check the tag, versions and changelog
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - run: npm run build
      - name: Install the packed CLI and run it
        run: npm run test:package

      # npm trusted publishing: npm exchanges the workflow's OIDC token for a short-lived publish
      # token, so there is no NPM_TOKEN secret. Set up once with:
      #   npm trust github logictrail --file release.yml --repo werlen-nevio/LogicTrail
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "logictrail@$version" version 2>/dev/null)" = "$version" ]; then
            echo "logictrail@$version is already on npm."
            exit 0
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --tag "$dist_tag"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The $GITHUB_REF_NAME release already exists."
            exit 0
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

      - name: Tag the Claude plugin release
        run: |
          plugin_tag="logictrail--$GITHUB_REF_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$plugin_tag" >/dev/null; then
            echo "$plugin_tag already exists."
            exit 0
          fi
          npm install --global @anthropic-ai/claude-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          claude plugin tag claude-plugin --push
